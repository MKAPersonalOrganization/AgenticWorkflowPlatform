version: 3
dotenv: [".env"]

env:
  APP_URL: https://127.0.0.1:8090

vars:
  TAILWIND_CMD:
    sh: command -v tailwindcss >/dev/null 2>&1 && echo "tailwindcss" || echo "npx tailwindcss@latest"

tasks:
  add-book:
    desc: "Convert EPUB to Markdown in books/ directory. Usage: task add-book -- path/to/file.epub"
    cmds:
      - mkdir -p books
      - mkdir -p .conversion_tmp
      - |
        FILE="{{.CLI_ARGS}}"
        # Strip potential surrounding quotes passed by task/shell
        FILE=$(echo "$FILE" | sed "s/^'//;s/'$//;s/^\"//;s/\"$//")
        if [ -z "$FILE" ]; then echo "Usage: task add-book -- path/to/file.epub"; exit 1; fi
        NAME=$(basename "$FILE" .epub)
          
        # Copy to temp dir to control output location and avoid path joining issues
        cp "$FILE" ".conversion_tmp/$NAME.epub"

        # Run conversion in temp dir
        # Output will be a directory at .conversion_tmp/NAME/ because we are not merging
        epub2md ".conversion_tmp/$NAME.epub"

        # Move to final destination
        if [ -d ".conversion_tmp/$NAME" ]; then
          # Remove existing directory if it exists to ensure clean state
          rm -rf "books/$NAME"
          mv ".conversion_tmp/$NAME" "books/"
          
          # Rename chapters based on content
          echo "Renaming chapters..."
          node tools/rename_chapters.js "books/$NAME"
          
          echo "Successfully converted to books/$NAME/"
        else
          echo "Error: Output directory not found at .conversion_tmp/$NAME"
          ls -R .conversion_tmp
          exit 1
        fi

        # Cleanup
        rm -rf .conversion_tmp

  update-templui:
    desc: "Update templui CLI and all installed components. Usage: task update-templui -- v1.5.0"
    cmds:
      - |
        REF="{{.CLI_ARGS}}"
        if [ -z "$REF" ]; then echo "Usage: task update-templui -- <version>"; exit 1; fi
        go install "github.com/templui/templui/cmd/templui@${REF}"
        yes | templui --installed "add@${REF}"
        templ generate

  setup-ubuntu:
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/templui/templui/cmd/templui@latest

  install-epub2md:
    desc: Install dependencies and build epub2MD
    dir: .READ/epub2MD
    cmds:
      - pnpm install
      - pnpm build

  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - templ generate --watch --proxy="https://localhost:8090" --cmd="go run ." --open-browser=false

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - "{{.TAILWIND_CMD}} -i ./assets/css/input.css -o ./assets/css/output.css --watch"

  kill-ports:
    desc: Kill processes using app ports (8090, 4015, 7331)
    cmds:
      - fuser -k 8090/tcp 2>/dev/null || true
      - fuser -k 4015/tcp 2>/dev/null || true
      - fuser -k 7331/tcp 2>/dev/null || true
      - echo "Ports 8090, 4015, and 7331 cleared"

  dev:
    desc: Start development server with hot reload
    cmds:
      - task kill-ports
      - task --parallel tailwind templ

  run: "wgo -file=.go -file=.templ -xfile=_templ.go  go tool templ generate :: go run main.go"

  up:
    desc: Start all docker compose services (includes dev-only override)
    cmds:
      - docker compose up -d

  up:prod:
    desc: "Production-parity: all services + containerised app (no dev UIs, no Redis host port)"
    cmds:
      - docker compose -f docker-compose.yml build --no-cache app
      - docker compose -f docker-compose.yml --profile prod up -d

  up:cluster:
    desc: "Distributed cluster: 10 app pods + Redis HA + Nginx LB"
    cmds:
      - docker compose -f docker-compose.cluster.yml build --no-cache app
      # Start everything, then wait only on long-running services.
      # (minio-create-bucket is a one-shot init container that exits 0
      #  and would cause --wait to report failure if included.)
      - docker compose -f docker-compose.cluster.yml up -d
      - docker compose -f docker-compose.cluster.yml up -d --wait migrate app lb
      - echo "✓ Cluster running — 10 pods behind https://localhost:8090"
      - docker compose -f docker-compose.cluster.yml ps app

  down:cluster:
    desc: "Tear down the distributed cluster"
    cmds:
      - docker compose -f docker-compose.cluster.yml down -v --remove-orphans

  logs:cluster:
    desc: "Follow cluster logs"
    cmds:
      - docker compose -f docker-compose.cluster.yml logs -f

  scale:
    desc: "Scale app pods (usage: task scale -- 20)"
    cmds:
      - docker compose -f docker-compose.cluster.yml up -d --scale app={{.CLI_ARGS}} --no-recreate
      - echo "✓ Scaled to {{.CLI_ARGS}} pods"
      - docker compose -f docker-compose.cluster.yml ps app

  down:
    desc: "Stop and remove containers, networks, and volumes"
    cmds:
      - docker compose --profile prod down -v --remove-orphans

  logs:
    desc: Show docker compose logs
    cmds:
      - docker compose logs -f

  statistics:
    desc: Generate and save git repository statistics
    cmds:
      - go run ./cmd/repo-statistics
      - xdg-open .github/images/repo_statistics.png 2>/dev/null || open .github/images/repo_statistics.png 2>/dev/null || echo "Graph saved at .github/images/repo_statistics.png"

  # ─── Hotspot analysis ─────────────────────────────────────────────────
  # scripts/go_hotspots.py ranks Go packages / functions by change frequency
  # × complexity (Tornhill, Your Code as a Crime Scene, ch. 3) and emits a
  # PNG, interactive HTML, JSON, and CSV to .hotspots/.
  #
  # Deps live in a self-contained venv at .hotspots/.venv so we don't clash
  # with PEP 668's externally-managed-environment lockout on Ubuntu 24.04+.
  # `task hotspots` auto-bootstraps on first run.

  hotspots:setup:
    desc: "Create .hotspots/.venv and install Python deps for the hotspot analyzer (idempotent)"
    status:
      # Skip unless venv is missing or a required lib is.
      - test -x .hotspots/.venv/bin/python3
      - .hotspots/.venv/bin/python3 -c "import tree_sitter_go, git, dateparser, matplotlib, circlify, plotly"
    cmds:
      - mkdir -p .hotspots
      - test -d .hotspots/.venv || python3 -m venv .hotspots/.venv
      - .hotspots/.venv/bin/pip install --quiet --upgrade pip
      - .hotspots/.venv/bin/pip install --quiet -r scripts/requirements-hotspots.txt
      - echo "✓ hotspot analyzer venv ready at .hotspots/.venv"

  hotspots:
    desc: "Hotspot analysis — rank Go packages by change frequency × complexity. Usage: task hotspots [-- PATH]. Env: SINCE (default '3 months ago'), UNTIL."
    deps: [hotspots:setup]
    vars:
      HOTSPOTS_PATH: '{{.CLI_ARGS | default "."}}'
      SINCE: '{{.SINCE | default "3 months ago"}}'
      UNTIL: '{{.UNTIL | default ""}}'
    cmds:
      - |
        UNTIL_ARG=""
        if [ -n "{{.UNTIL}}" ]; then UNTIL_ARG="--until={{.UNTIL}}"; fi
        .hotspots/.venv/bin/python3 scripts/go_hotspots.py "{{.HOTSPOTS_PATH}}" \
          --since "{{.SINCE}}" $UNTIL_ARG \
          --exclude '^frontend/' \
          --out .hotspots/go_hotspots.png \
          --html .hotspots/go_hotspots.html \
          --json .hotspots/go_hotspots.json \
          --csv .hotspots/go_hotspots.csv
      - echo "" && echo "Outputs saved to .hotspots/"
      - xdg-open .hotspots/go_hotspots.png 2>/dev/null || open .hotspots/go_hotspots.png 2>/dev/null || true

  # ─── Complexity-trend analysis ────────────────────────────────────────
  # scripts/complexity_trend.py visualises whitespace-indentation complexity
  # per revision (Tornhill, Your Code as a Crime Scene, ch. 5) to spot
  # structures that are deteriorating faster than they're growing.
  #
  # Reuses the .hotspots/.venv from hotspots:setup for matplotlib. Outputs
  # land in .hotspots/complexity_trend/.

  trends:
    desc: "Complexity trend for specific files. Usage: task trends -- path/a.go path/b.js. Env: SINCE (default '6 months ago'), SAMPLES (default 20)."
    deps: [hotspots:setup]
    vars:
      SINCE: '{{.SINCE | default "6 months ago"}}'
      SAMPLES: '{{.SAMPLES | default "20"}}'
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task trends -- <path> [path...]"; exit 1
        fi
        .hotspots/.venv/bin/python3 scripts/complexity_trend.py \
          --since "{{.SINCE}}" --samples {{.SAMPLES}} --summary \
          --out .hotspots/complexity_trend \
          {{.CLI_ARGS}}
      - echo "" && echo "Outputs saved to .hotspots/complexity_trend/"
      - xdg-open .hotspots/complexity_trend/_summary.png 2>/dev/null || open .hotspots/complexity_trend/_summary.png 2>/dev/null || true

  trends:top:
    desc: "Rank + plot the top N deteriorating files repo-wide. Env: TOP (default 10), SINCE (default '6 months ago'), SAMPLES (default 20), MIN_COMMITS (default 8), MIN_LOC (default 150)."
    deps: [hotspots:setup]
    vars:
      TOP: '{{.TOP | default "10"}}'
      SINCE: '{{.SINCE | default "6 months ago"}}'
      SAMPLES: '{{.SAMPLES | default "20"}}'
      MIN_COMMITS: '{{.MIN_COMMITS | default "8"}}'
      MIN_LOC: '{{.MIN_LOC | default "150"}}'
    cmds:
      - |
        .hotspots/.venv/bin/python3 scripts/complexity_trend.py \
          --discover --top {{.TOP}} \
          --since "{{.SINCE}}" --samples {{.SAMPLES}} \
          --min-commits {{.MIN_COMMITS}} --min-loc {{.MIN_LOC}} \
          --out .hotspots/complexity_trend
      - echo "" && echo "Outputs saved to .hotspots/complexity_trend/"
      - xdg-open .hotspots/complexity_trend/_summary.png 2>/dev/null || open .hotspots/complexity_trend/_summary.png 2>/dev/null || true

  ci:
    desc: Run CI checks (format, lint, test, arch tests, build)
    cmds:
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofmt -w {} +
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofumpt -w {} +
      - golangci-lint run --fix ./...
      - go test -race -v ./...
      - go test -v ./arch/...
      - go build -o bin/app ./main.go
      - rm -f bin/app
      - find ./services/agentorchestrator/agents -type d -name "charts" -exec rm -rf {} + 2>/dev/null || true
      - find ./services/agentorchestrator/agents -type d -name "animations" -exec rm -rf {} + 2>/dev/null || true
      - find . -name "*.gp" -path "*/assets/*" -delete 2>/dev/null || true
      - find . -name "*.png" -path "*/assets/charts/*" -delete 2>/dev/null || true
      - find . -name "*.gif" -path "*/assets/animations/*" -delete 2>/dev/null || true

  integration:
    desc: Run integration tests
    cmds:
      - go test -tags integration -v ./userrequirements/...

  integration:dox:
    desc: Run integration tests with gotestdox (behavior-driven output)
    cmds:
      - go test -tags integration -json ./userrequirements/... | gotestdox
