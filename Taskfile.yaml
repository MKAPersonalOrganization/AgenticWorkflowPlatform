version: 3
dotenv: [".env"]

env:
  APP_URL: https://127.0.0.1:8090

vars:
  TAILWIND_CMD:
    sh: command -v tailwindcss >/dev/null 2>&1 && echo "tailwindcss" || echo "npx tailwindcss@latest"

tasks:
  add-book:
    desc: "Convert EPUB to Markdown in books/ directory. Usage: task add-book -- path/to/file.epub"
    cmds:
      - mkdir -p books
      - mkdir -p .conversion_tmp
      - |
        FILE="{{.CLI_ARGS}}"
        # Strip potential surrounding quotes passed by task/shell
        FILE=$(echo "$FILE" | sed "s/^'//;s/'$//;s/^\"//;s/\"$//")
        if [ -z "$FILE" ]; then echo "Usage: task add-book -- path/to/file.epub"; exit 1; fi
        NAME=$(basename "$FILE" .epub)
          
        # Copy to temp dir to control output location and avoid path joining issues
        cp "$FILE" ".conversion_tmp/$NAME.epub"

        # Run conversion in temp dir
        # Output will be a directory at .conversion_tmp/NAME/ because we are not merging
        epub2md ".conversion_tmp/$NAME.epub"

        # Move to final destination
        if [ -d ".conversion_tmp/$NAME" ]; then
          # Remove existing directory if it exists to ensure clean state
          rm -rf "books/$NAME"
          mv ".conversion_tmp/$NAME" "books/"
          
          # Rename chapters based on content
          echo "Renaming chapters..."
          node tools/rename_chapters.js "books/$NAME"
          
          echo "Successfully converted to books/$NAME/"
        else
          echo "Error: Output directory not found at .conversion_tmp/$NAME"
          ls -R .conversion_tmp
          exit 1
        fi

        # Cleanup
        rm -rf .conversion_tmp

  update-templui:
    desc: "Update templui CLI and all installed components. Usage: task update-templui -- v1.5.0"
    cmds:
      - |
        REF="{{.CLI_ARGS}}"
        if [ -z "$REF" ]; then echo "Usage: task update-templui -- <version>"; exit 1; fi
        go install "github.com/templui/templui/cmd/templui@${REF}"
        yes | templui --installed "add@${REF}"
        templ generate

  setup-ubuntu:
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/templui/templui/cmd/templui@latest

  install-epub2md:
    desc: Install dependencies and build epub2MD
    dir: .READ/epub2MD
    cmds:
      - pnpm install
      - pnpm build

  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - templ generate --watch --proxy="https://localhost:8090" --cmd="go run ." --open-browser=false

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - "{{.TAILWIND_CMD}} -i ./assets/css/input.css -o ./assets/css/output.css --watch"

  kill-ports:
    desc: Kill processes using app ports (8090, 4015, 7331)
    cmds:
      - fuser -k 8090/tcp 2>/dev/null || true
      - fuser -k 4015/tcp 2>/dev/null || true
      - fuser -k 7331/tcp 2>/dev/null || true
      - echo "Ports 8090, 4015, and 7331 cleared"

  dev:
    desc: Start development server with hot reload
    cmds:
      - task kill-ports
      - task --parallel tailwind templ

  run: "wgo -file=.go -file=.templ -xfile=_templ.go  go tool templ generate :: go run main.go"

  up:
    desc: Start all docker compose services (includes dev-only override)
    cmds:
      - docker compose up -d

  up:prod:
    desc: "Production-parity: all services + containerised app (no dev UIs, no Redis host port)"
    cmds:
      - docker compose -f docker-compose.yml build --no-cache app
      - docker compose -f docker-compose.yml --profile prod up -d

  up:cluster:
    desc: "Distributed cluster: 10 app pods + Redis HA + Nginx LB"
    cmds:
      - docker compose -f docker-compose.cluster.yml build --no-cache app
      # Start everything, then wait only on long-running services.
      # (minio-create-bucket is a one-shot init container that exits 0
      #  and would cause --wait to report failure if included.)
      - docker compose -f docker-compose.cluster.yml up -d
      - docker compose -f docker-compose.cluster.yml up -d --wait migrate app lb
      - echo "✓ Cluster running — 10 pods behind https://localhost:8090"
      - docker compose -f docker-compose.cluster.yml ps app

  down:cluster:
    desc: "Tear down the distributed cluster"
    cmds:
      - docker compose -f docker-compose.cluster.yml down -v --remove-orphans

  logs:cluster:
    desc: "Follow cluster logs"
    cmds:
      - docker compose -f docker-compose.cluster.yml logs -f

  scale:
    desc: "Scale app pods (usage: task scale -- 20)"
    cmds:
      - docker compose -f docker-compose.cluster.yml up -d --scale app={{.CLI_ARGS}} --no-recreate
      - echo "✓ Scaled to {{.CLI_ARGS}} pods"
      - docker compose -f docker-compose.cluster.yml ps app

  down:
    desc: "Stop and remove containers, networks, and volumes"
    cmds:
      - docker compose --profile prod down -v --remove-orphans

  logs:
    desc: Show docker compose logs
    cmds:
      - docker compose logs -f

  statistics:
    desc: Generate and save git repository statistics
    cmds:
      - go run ./cmd/repo-statistics
      - xdg-open .github/images/repo_statistics.png 2>/dev/null || open .github/images/repo_statistics.png 2>/dev/null || echo "Graph saved at .github/images/repo_statistics.png"

  # ─── Code Maat Analysis Suite ─────────────────────────────────────────
  # All analyses save results to .maat/ directory.
  # Set MAAT_JAR env var to point to your code-maat standalone jar.
  # Set MAAT_AFTER to a YYYY-MM-DD date to limit the analysis window.
  # Download: https://github.com/adamtornhill/code-maat/releases

  maat:gen-log:
    desc: "[internal] Generate git log for code-maat analyses"
    internal: true
    vars:
      MAAT_AFTER: '{{.MAAT_AFTER | default ""}}'
    cmds:
      - mkdir -p .maat
      - |
        AFTER_FLAG=""
        if [ -n "{{.MAAT_AFTER}}" ]; then
          AFTER_FLAG="--after={{.MAAT_AFTER}}"
        fi
        git log --all --numstat --date=short \
          --pretty=format:'--%h--%ad--%aN' \
          --no-renames $AFTER_FLAG \
          -- . ":(exclude)vendor/" ":(exclude).READ/" ":(exclude)go.sum" ":(exclude)go.mod" ":(exclude)*_test.go" ":(exclude)*_templ.go" ":(exclude)*_mock.go" ":(exclude)mock_*.go" ":(exclude)frontend/" ":(exclude)assets/" \
          > .maat/git.log
        echo "Git log generated (.maat/git.log)"

  maat:check:
    desc: "[internal] Verify code-maat JAR exists"
    internal: true
    vars:
      MAAT_JAR: '{{.MAAT_JAR | default "code-maat.jar"}}'
    preconditions:
      - sh: test -f "{{.MAAT_JAR}}"
        msg: |
          code-maat JAR not found at '{{.MAAT_JAR}}'.
          Download from: https://github.com/adamtornhill/code-maat/releases
          Then either place it in the project root or set MAAT_JAR=/path/to/jar

  maat:run:
    desc: "[internal] Run a code-maat analysis"
    internal: true
    vars:
      MAAT_JAR: '{{.MAAT_JAR | default "code-maat.jar"}}'
    cmds:
      - |
        java -Djava.awt.headless=true -Xmx4g \
          -jar "{{.MAAT_JAR}}" \
          -l .maat/git.log -c git2 \
          -a {{.ANALYSIS}} \
          {{.EXTRA_ARGS | default ""}} \
          > ".maat/{{.OUTPUT}}"

  hotspots:
    desc: "Hotspots — files that change most frequently"
    vars:
      MAAT_JAR: '{{.MAAT_JAR | default "code-maat.jar"}}'
    cmds:
      - task: maat:gen-log
      - |
        if [ ! -f "{{.MAAT_JAR}}" ]; then
          echo "═══ Code Hotspot Analysis (fallback — no code-maat) ═══"
          echo ""
          echo "Top 30 most frequently changed files:"
          echo "───────────────────────────────────────"
          git log --name-only --pretty=format: \
            | grep -v '^\s*$' \
            | grep -v '^vendor/' \
            | sort | uniq -c | sort -rn | head -30
        else
          java -Djava.awt.headless=true -Xmx4g \
            -jar "{{.MAAT_JAR}}" \
            -l .maat/git.log -c git2 \
            -a revisions \
            > .maat/hotspots.csv

          echo "═══ Code Hotspot Analysis ═══"
          echo ""
          echo "Top 30 hotspots (by change frequency):"
          echo "───────────────────────────────────────"
          sort -t, -k2 -rn .maat/hotspots.csv | head -30 | column -t -s,
          echo ""
          echo "Full report: .maat/hotspots.csv"
        fi

  coupling:
    desc: "Logical coupling — files that always change together (hidden dependencies)"
    deps: [maat:gen-log, maat:check]
    vars:
      MAAT_JAR: '{{.MAAT_JAR | default "code-maat.jar"}}'
      MIN_REVS: '{{.MIN_REVS | default "10"}}'
      MIN_COUPLING: '{{.MIN_COUPLING | default "30"}}'
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: coupling
          OUTPUT: coupling.csv
          EXTRA_ARGS: "-n {{.MIN_REVS}} -i {{.MIN_COUPLING}}"
      - |
        echo "═══ Logical Coupling Analysis ═══"
        echo ""
        echo "Files that change together (≥{{.MIN_COUPLING}}% coupling, ≥{{.MIN_REVS}} shared revisions):"
        echo "──────────────────────────────────────────────────────────────────────────"
        sort -t, -k3 -rn .maat/coupling.csv | head -30 | column -t -s,
        echo ""
        echo "⚠  High coupling between unrelated modules suggests hidden dependencies."
        echo "Full report: .maat/coupling.csv"

  code-age:
    desc: "Code age — how long since each file was last changed (stability indicator)"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: age
          OUTPUT: code-age.csv
      - |
        echo "═══ Code Age Analysis ═══"
        echo ""
        echo "Most recently changed files (least stable):"
        echo "─────────────────────────────────────────────"
        sort -t, -k2 -n .maat/code-age.csv | head -20 | column -t -s,
        echo ""
        echo "Oldest unchanged files (most stable):"
        echo "──────────────────────────────────────"
        sort -t, -k2 -rn .maat/code-age.csv | head -20 | column -t -s,
        echo ""
        echo "Full report: .maat/code-age.csv"

  churn:
    desc: "Code churn — lines added/deleted per file (defect predictor)"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: entity-churn
          OUTPUT: churn.csv
      - |
        echo "═══ Code Churn Analysis ═══"
        echo ""
        echo "Top 30 files by total churn (added + deleted lines):"
        echo "─────────────────────────────────────────────────────"
        tail -n +2 .maat/churn.csv \
          | awk -F, '{print $0","$2+$3}' \
          | sort -t, -k4 -rn \
          | head -30 \
          | column -t -s,
        echo ""
        echo "⚠  High churn correlates with post-release defects."
        echo "Full report: .maat/churn.csv"

  authors:
    desc: "Author analysis — number of contributors per file (communication complexity)"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: authors
          OUTPUT: authors.csv
      - |
        echo "═══ Authors Analysis ═══"
        echo ""
        echo "Files with most contributors (highest coordination cost):"
        echo "──────────────────────────────────────────────────────────"
        sort -t, -k2 -rn .maat/authors.csv | head -20 | column -t -s,
        echo ""
        echo "Full report: .maat/authors.csv"

  main-dev:
    desc: "Main developer — who owns which files (knowledge risk if they leave)"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: main-dev-by-revs
          OUTPUT: main-dev.csv
      - |
        echo "═══ Main Developer Analysis ═══"
        echo ""
        echo "Primary owner of each file (by revision count):"
        echo "────────────────────────────────────────────────"
        head -30 .maat/main-dev.csv | column -t -s,
        echo ""
        echo "⚠  Files owned >80% by one dev are a knowledge bus-factor risk."
        echo "Full report: .maat/main-dev.csv"

  fragmentation:
    desc: "Code fragmentation — how scattered are contributions across authors"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: fragmentation
          OUTPUT: fragmentation.csv
      - |
        echo "═══ Fragmentation Analysis ═══"
        echo ""
        echo "Most fragmented files (many authors, no clear owner):"
        echo "──────────────────────────────────────────────────────"
        sort -t, -k2 -rn .maat/fragmentation.csv | head -20 | column -t -s,
        echo ""
        echo "⚠  High fragmentation = diffused responsibility = more defects."
        echo "Full report: .maat/fragmentation.csv"

  soc:
    desc: "Sum of coupling — which files are coupled to the most other files"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: soc
          OUTPUT: soc.csv
      - |
        echo "═══ Sum of Coupling Analysis ═══"
        echo ""
        echo "Files with highest total coupling (architectural bottlenecks):"
        echo "───────────────────────────────────────────────────────────────"
        sort -t, -k2 -rn .maat/soc.csv | head -20 | column -t -s,
        echo ""
        echo "⚠  High SoC files are architectural chokepoints — changes ripple everywhere."
        echo "Full report: .maat/soc.csv"

  maat:summary:
    desc: "Repository summary — high-level stats about the codebase"
    deps: [maat:gen-log, maat:check]
    cmds:
      - task: maat:run
        vars:
          ANALYSIS: summary
          OUTPUT: summary.csv
      - |
        echo "═══ Repository Summary ═══"
        echo ""
        column -t -s, .maat/summary.csv
        echo ""

  analyze:
    desc: "Run ALL code-maat analyses (File + Architecture), generate dashboards"
    cmds:
      - task: maat:gen-log
      - task: maat:check
      - task: maat:summary
      - task: hotspots
      - task: coupling
      - task: code-age
      - task: churn
      - task: authors
      - task: main-dev
      - task: fragmentation
      - task: soc
      - task: analyze:architecture
      - task: visualize
      - |
        echo ""
        echo "═══════════════════════════════════════"
        echo "  All reports saved to .maat/"
        echo "═══════════════════════════════════════"
        echo ""
        ls -la .maat/*.csv .maat/*.png .maat/arch/*.csv 2>/dev/null || true

  analyze:architecture:
    desc: "Run code-maat architectural (domain-level) analyses"
    vars:
      MAAT_JAR: '{{.MAAT_JAR | default "code-maat.jar"}}'
    cmds:
      - mkdir -p .maat/arch
      - |
        set -x
        if [ ! -f "{{.MAAT_JAR}}" ]; then echo "Skipping architecture analysis, no JAR"; exit 0; fi
        
        echo "Generating Architectural (Domain) Output..."
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a revisions -g scripts/go_grouping.txt > .maat/arch/hotspots.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a coupling -g scripts/go_grouping.txt > .maat/arch/coupling.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a age -g scripts/go_grouping.txt > .maat/arch/code-age.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a entity-churn -g scripts/go_grouping.txt > .maat/arch/churn.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a fragmentation -g scripts/go_grouping.txt > .maat/arch/fragmentation.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a soc -g scripts/go_grouping.txt > .maat/arch/soc.csv
        java -Djava.awt.headless=true -Xmx4g -jar "{{.MAAT_JAR}}" -l .maat/git.log -c git2 -a summary > .maat/arch/summary.csv

  visualize:
    desc: "Generate visual dashboards from code-maat CSV reports"
    cmds:
      - python3 scripts/maat-visualize.py --maat-dir .maat --output .maat/dashboard_files.png --filter-missing
      - python3 scripts/maat-visualize.py --maat-dir .maat/arch --output .maat/dashboard_architecture.png
      - echo "Dashboards saved in .maat directory"

  ci:
    desc: Run CI checks (format, lint, test, arch tests, build)
    cmds:
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofmt -w {} +
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofumpt -w {} +
      - golangci-lint run --fix ./...
      - go test -race -v ./...
      - go test -v ./arch/...
      - go build -o bin/app ./main.go
      - rm -f bin/app
      - find ./services/agentorchestrator/agents -type d -name "charts" -exec rm -rf {} + 2>/dev/null || true
      - find ./services/agentorchestrator/agents -type d -name "animations" -exec rm -rf {} + 2>/dev/null || true
      - find . -name "*.gp" -path "*/assets/*" -delete 2>/dev/null || true
      - find . -name "*.png" -path "*/assets/charts/*" -delete 2>/dev/null || true
      - find . -name "*.gif" -path "*/assets/animations/*" -delete 2>/dev/null || true

  integration:
    desc: Run integration tests
    cmds:
      - go test -tags integration -v ./userrequirements/...

  integration:dox:
    desc: Run integration tests with gotestdox (behavior-driven output)
    cmds:
      - go test -tags integration -json ./userrequirements/... | gotestdox
