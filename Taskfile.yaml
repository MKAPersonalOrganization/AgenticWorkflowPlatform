version: 3
dotenv: [".env"]

env:
  APP_URL: http://127.0.0.1:8090
  KRATOS_PUBLIC_URL: http://127.0.0.1:4433
  KRATOS_ADMIN_URL: http://127.0.0.1:4434
  KRATOS_BROWSER_URL: http://127.0.0.1:4433

vars:
  TAILWIND_CMD:
    sh: command -v tailwindcss >/dev/null 2>&1 && echo "tailwindcss" || echo "npx tailwindcss@latest"

tasks:
  setup-ubuntu:
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest
      - go install github.com/templui/templui/cmd/templui@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - templ generate --watch --proxy="http://localhost:8090" --cmd="go run ./main.go" --open-browser=false

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - "{{.TAILWIND_CMD}} -i ./assets/css/input.css -o ./assets/css/output.css --watch"

  kill-ports:
    desc: Kill processes using app ports (8090, 4015, 7331)
    cmds:
      - fuser -k 8090/tcp 2>/dev/null || true
      - fuser -k 4015/tcp 2>/dev/null || true
      - fuser -k 7331/tcp 2>/dev/null || true
      - echo "Ports 8090, 4015, and 7331 cleared"

  dev:
    desc: Start development server with hot reload
    cmds:
      - task kill-ports
      - task --parallel tailwind templ

  run: "wgo -file=.go -file=.templ -xfile=_templ.go  go tool templ generate :: go run main.go"

  up:
    desc: Start all docker compose services (Redis, Asynqmon, Kratos, Postgres, MailSlurper, KurrentDB, Typesense, Langfuse)
    cmds:
      - docker compose up -d

  down:
    desc: Stop all docker compose services
    cmds:
      - docker compose down

  logs:
    desc: Show docker compose logs
    cmds:
      - docker compose logs -f kratos

  statistics:
    desc: Generate and save git repository statistics
    cmds:
      - go run ./tools/repo-statistics
      - xdg-open .github/images/repo_statistics.png 2>/dev/null || open .github/images/repo_statistics.png 2>/dev/null || echo "Graph saved at .github/images/repo_statistics.png"

  ci:
    desc: Run CI checks (format, lint, test, arch tests, build)
    cmds:
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofmt -w {} +
      - find . -name "*.go" -not -path "./.READ/*" -not -path "*/testdata/*" -not -path "./bin/*" -not -path "./components/*" -exec gofumpt -w {} +
      - golangci-lint run --fix ./...
      - go test -race -v ./...
      - go test -v ./arch/...
      - go build -o bin/app ./main.go
      - rm -f bin/app
