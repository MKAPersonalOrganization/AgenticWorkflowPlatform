# LightRAG Configuration for PostgreSQL Storage

[postgres]
# PostgreSQL connection settings - using environment variables from docker-compose
host = lightrag-postgres
port = 5432
user = rag
password = rag
database = rag
# Optional: workspace name for multi-tenancy
# workspace = default
max_connections = 12
# Vector index configuration
vector_index_type = HNSW        # HNSW, IVFFLAT or VCHORDRQ
hnsw_m = 16
hnsw_ef = 64
ivfflat_lists = 100
vchordrq_build_options =
vchordrq_probes =
vchordrq_epsilon = 1.9

[redis]
# Redis for caching (using shared redis instance)
uri = redis://redis:6379/2
