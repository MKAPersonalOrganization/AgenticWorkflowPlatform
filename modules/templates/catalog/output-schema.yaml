name: Output Schema
slug: output-schema
description: "Agent with output_schema forcing structured JSON output from ADK Python samples (deep-search research_evaluator, travel-concierge planning): the agent returns strictly typed JSON matching a schema instead of free-form text. Demonstrates how to enforce structured output for downstream processing."
system_prompt: "Extract structured data from the input and return valid JSON matching the required schema."
category: Examples
tags: [output-schema, structured-output, json, data-extraction, adk-sample]
author_name: ADK
icon: file-json
featured: true

# Workflow: sequential(extractor[output_schema] → formatter)
workflow:
  id: root
  type: sequential
  children:
    - id: n1
      type: agent
      agent_id: sub-extractor
      output_schema: '{"type":"object","required":["title","summary","tags","entities"],"properties":{"title":{"type":"string","description":"Main topic title"},"summary":{"type":"string","description":"2-3 sentence summary"},"tags":{"type":"array","items":{"type":"string"},"description":"3-5 relevant tags"},"entities":{"type":"array","items":{"type":"object","required":["name","type"],"properties":{"name":{"type":"string"},"type":{"type":"string","description":"person|organization|location|technology|event"}}},"description":"Key entities mentioned"}}}'
    - id: n2
      type: agent
      agent_id: sub-formatter

sub_agents:
  - id: sub-extractor
    name: DataExtractorAgent
    description: Extracts structured data from the input text and returns JSON matching the output_schema.
    icon: database
    output_key: structured_data
    system_prompt: |
      ## Role: Data Extractor

      ## Objective
      Analyse the user's input text and extract structured information as JSON.

      ## Instructions
      1. Read the input text carefully.
      2. Extract:
         - **title:** The main topic or subject
         - **summary:** A 2-3 sentence summary of the key points
         - **tags:** 3-5 relevant keywords or categories
         - **entities:** Key people, organisations, locations, technologies, or events mentioned
      3. Return ONLY valid JSON matching the required schema.
      4. Do NOT include any text outside the JSON object.

  - id: sub-formatter
    name: ReportFormatterAgent
    description: Takes the structured JSON data and produces a polished human-readable report.
    icon: file-text
    output_key: formatted_report
    system_prompt: |
      ## Role: Report Formatter

      ## Objective
      Convert structured JSON data into a polished, human-readable report.

      ## Instructions
      1. Read the structured data: {structured_data}
      2. Produce a well-formatted report with:
         - A clear heading (title)
         - An executive summary paragraph
         - A section listing key entities mentioned
         - Tags displayed as a comma-separated list
      3. Use professional, clear language.
      4. Format in Markdown.
