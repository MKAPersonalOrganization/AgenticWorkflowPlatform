# Nginx load balancer for AiCompass cluster
#
# Routes HTTPS traffic across N app replicas using least-connections.
# SSE streams use ip_hash so reconnects hit the same pod (leveraging the
# in-process ring buffer) — but correctness doesn't depend on it because
# reconnects include ?lastEventId= for cross-pod replay via Redis Streams.

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Upstream: app replicas (Docker Compose DNS resolves to all 10 IPs)
    # -------------------------------------------------------------------------
    upstream app_backend {
        least_conn;

        # Docker Compose service discovery — resolves to all replica IPs.
        # Both "migrate" (pod #0, runs migrations) and "app" (pods 1-10)
        # serve traffic.
        server migrate:8090;
        server app:8090;
    }

    # Use Docker's embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # -------------------------------------------------------------------------
    # Global settings
    # -------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Limit request body size (defense-in-depth — app also enforces this)
    client_max_body_size 50m;

    # Timeouts tuned for SSE: proxy_read_timeout is how long Nginx waits for
    # the upstream to send data. SSE heartbeats arrive every 15s, so 60s is
    # generous. If the upstream pod dies, Nginx detects it within 60s and the
    # client reconnects to a healthy pod.
    proxy_connect_timeout  5s;
    proxy_send_timeout     30s;
    proxy_read_timeout     60s;

    # -------------------------------------------------------------------------
    # Health check endpoint (for the LB's own healthcheck)
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS termination + reverse proxy
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ----- SSE endpoints — tuned for long-lived connections -----
        location ~ ^/v1/tasks/.+:subscribe$ {
            proxy_pass         https://app_backend;

            # SSE: disable buffering so events stream immediately
            proxy_buffering    off;
            proxy_cache        off;

            # SSE: long read timeout — heartbeats arrive every 15s
            proxy_read_timeout 1800s;

            # SSE: required headers
            proxy_set_header   Connection       "";
            proxy_http_version 1.1;

            # Forward client identity
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ----- All other traffic -----
        location / {
            proxy_pass         https://app_backend;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # ----- Static assets — cache aggressively -----
        location /assets/ {
            proxy_pass         https://app_backend;

            proxy_set_header   Host              $host;
            proxy_http_version 1.1;

            # Cache static assets at the LB level
            proxy_cache_valid  200 1h;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
