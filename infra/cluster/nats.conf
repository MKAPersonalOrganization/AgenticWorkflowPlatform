# NATS server configuration — shared across all 3 cluster nodes.
# Node-specific settings (--name, --cluster, --routes) are passed via CLI
# so the same file can be mounted into all three containers.

jetstream {
  store_dir: /data
  max_mem_store: 256mb
  max_file_store: 4gb
}

authorization {
  user: "nats"
  password: $NATS_PASSWORD
}

# Monitoring endpoint — used by the Docker healthcheck and observability tools.
http_port: 8222

# 2 MB max payload matches the MaxMsgSize set on the THREADS stream.
max_payload: 2097152
