# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

linters:
  # Enable specific linters explicitly
  enable:
    - errcheck # Check for unchecked errors
    - govet # Vet examines Go source code and reports suspicious constructs
    - ineffassign # Detects when assignments to existing variables are not used
    - staticcheck # Set of rules from staticcheck
    - unused # Checks Go code for unused constants, variables, functions and types
    - paralleltest # Detects missing usage of t.Parallel() method in tests
    - gosec # Inspects source code for security problems
    - bodyclose # Checks whether HTTP response body is closed successfully

  # Disable deprecated linters
  disable:
    - wsl # Deprecated, replaced by wsl_v5
    - wsl_v5 # Too strict for whitespace rules

  settings:
    gosec:
      excludes:
        - G204 # Subprocess execution - args are validated at call sites; gosec can't trace the validation
        - G120 # Form parsing - bounded via http.MaxBytesReader at every call site; gosec doesn't trace through
        - G704 # Outbound HTTP - URLs validated via safeOutboundURL / safeURL allowlists; taint persists through validation

  exclusions:
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - goconst

      # Exclude generated files
      - path: _templ\.go$
        linters:
          - all

      # Exclude templui-generated component/util files (regenerated by `templui` CLI).
      # The "all" sentinel does not match explicitly-enabled linters in v2, so
      # the enabled set is listed verbatim.
      - path: (utils/templui|icon/(icon|icon_data|icon_defs))\.go$
        linters:
          - errcheck
          - govet
          - ineffassign
          - staticcheck
          - unused
          - paralleltest
          - gosec
          - bodyclose

      # rag-cli is a developer/operator CLI tool. Templates and URLs are
      # operator-supplied via config, not exposed to untrusted users.
      - path: cmd/rag-cli/
        text: "G708"
        linters:
          - gosec

      # Ignore long lines in go:generate
      - linters:
          - lll
        source: "^//go:generate "

formatters:
  enable:
    - gofmt # Check whether code was gofmt-ed
    - gofumpt # Stricter gofmt
    - goimports # Check import statements are formatted

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.23"

output:
  formats:
    text:
      print-linter-name: true
  sort-order:
    - linter
    - severity
    - file
