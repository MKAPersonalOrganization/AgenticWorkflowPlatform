# docker-compose.cluster.yml — Distributed Cluster (10 app pods + Redis Sentinel)
#
# Simulates a production-like distributed deployment on a single machine:
#   - 10 stateless app replicas behind an Nginx load balancer
#   - Redis Sentinel (1 master + 2 replicas + 3 sentinels) for HA cache
#   - PostgreSQL (single, same as prod — PgBouncer would be next step)
#   - Shared MinIO, EdgeQuake
#
# Usage:
#   task up:cluster          — build & start everything
#   task down:cluster        — tear down
#   task logs:cluster        — follow logs
#
# The load balancer is exposed on :8090 (HTTPS). Individual pods are not
# exposed — all traffic flows through Nginx.

services:
  # ===========================================================================
  # Load Balancer — distributes HTTPS traffic across 10 app pods
  # ===========================================================================
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8090:443"
    volumes:
      - ./infra/cluster/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      - intranet
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # Migration Leader — runs DB migrations, then serves traffic as pod #0.
  # All other app replicas wait for this to be healthy before starting,
  # ensuring migrations complete exactly once before any pod accepts requests.
  # ===========================================================================
  migrate:
    image: ai-chat-platform:local
    deploy:
      replicas: 1
    expose:
      - "8090"
    networks:
      - intranet
    environment:
      - APP_WEB_API_HOST=0.0.0.0:8090
      - APP_WEB_TLS_CERT=/app/tls/cert.pem
      - APP_WEB_TLS_KEY=/app/tls/key.pem
      - APP_REDIS_ADDR=redis-master:6379
      - APP_REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_DB_HOST=app-postgres:5432
      - APP_DB_USER=appuser
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - APP_DB_NAME=projections
      - APP_DB_DISABLE_TLS=true
      - APP_AUTH_APP_URL=https://localhost:8090
      - APP_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APP_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_AUTH_SESSION_SECRET=${SESSION_SECRET}
      - APP_AUTH_GIT_HUB_CLIENT_ID=${APP_AUTH_GIT_HUB_CLIENT_ID}
      - APP_AUTH_GIT_HUB_CLIENT_SECRET=${APP_AUTH_GIT_HUB_CLIENT_SECRET}
      - APP_EDGEQUAKE_BASE_URL=http://edgequake-api:8080
      - APP_EDGEQUAKE_TENANT_ID=${APP_EDGEQUAKE_TENANT_ID}
      - APP_ARTIFACTS_S_3_ENDPOINT=minio:9000
      - APP_ARTIFACTS_S_3_ACCESS_KEY=${APP_ARTIFACTS_S_3_ACCESS_KEY}
      - APP_ARTIFACTS_S_3_SECRET_KEY=${APP_ARTIFACTS_S_3_SECRET_KEY}
      - APP_ARTIFACTS_S_3_BUCKET=artifacts
      - APP_ARTIFACTS_S_3_USE_SSL=false
      - APP_DASHBOARD_ADMIN_USER=${APP_DASHBOARD_ADMIN_USER:-admin}
      - APP_DASHBOARD_ADMIN_PASS=${APP_DASHBOARD_ADMIN_PASS}
      - APP_STRIPE_SECRET_KEY=${APP_STRIPE_SECRET_KEY}
      - APP_STRIPE_PUBLISHABLE_KEY=${APP_STRIPE_PUBLISHABLE_KEY}
      - APP_STRIPE_WEBHOOK_SECRET=${APP_STRIPE_WEBHOOK_SECRET}
      - APP_STRIPE_PRICE_ID=${APP_STRIPE_PRICE_ID}
      # This pod runs migrations (no APP_SKIP_MIGRATIONS)
      - APP_DB_MAX_IDLE_CONNS=10
      - APP_DB_MAX_OPEN_CONNS=20
      # A2A: Allow connecting to private/Docker-internal agent addresses
      - A2A_ALLOW_PRIVATE_NETWORKS=true
    volumes:
      - ./tls:/app/tls:ro
    depends_on:
      redis-master:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--no-check-certificate",
          "-q",
          "https://127.0.0.1:8090/liveness",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ===========================================================================
  # Application — 10 stateless replicas
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-chat-platform:local
    deploy:
      replicas: 10
    # No host port — only reachable via the load balancer.
    expose:
      - "8090"
    environment:
      - APP_WEB_API_HOST=0.0.0.0:8090
      - APP_WEB_DEBUG_HOST=127.0.0.1:4015
      # TLS terminated at Nginx; app speaks plain HTTPS internally
      - APP_WEB_TLS_CERT=/app/tls/cert.pem
      - APP_WEB_TLS_KEY=/app/tls/key.pem
      # Redis Sentinel — app connects to sentinel which routes to current master
      - APP_REDIS_ADDR=redis-master:6379
      - APP_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Database
      - APP_DB_HOST=app-postgres:5432
      - APP_DB_USER=appuser
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      - APP_DB_NAME=projections
      - APP_DB_DISABLE_TLS=true
      # Auth
      - APP_AUTH_APP_URL=https://localhost:8090
      - APP_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APP_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_AUTH_SESSION_SECRET=${SESSION_SECRET}
      - APP_AUTH_GIT_HUB_CLIENT_ID=${APP_AUTH_GIT_HUB_CLIENT_ID}
      - APP_AUTH_GIT_HUB_CLIENT_SECRET=${APP_AUTH_GIT_HUB_CLIENT_SECRET}
      # MinIO
      - APP_ARTIFACTS_S_3_ENDPOINT=minio:9000
      - APP_ARTIFACTS_S_3_ACCESS_KEY=${APP_ARTIFACTS_S_3_ACCESS_KEY}
      - APP_ARTIFACTS_S_3_SECRET_KEY=${APP_ARTIFACTS_S_3_SECRET_KEY}
      - APP_ARTIFACTS_S_3_BUCKET=artifacts
      - APP_ARTIFACTS_S_3_USE_SSL=false
      # EdgeQuake
      - APP_EDGEQUAKE_BASE_URL=http://edgequake-api:8080
      - APP_EDGEQUAKE_TENANT_ID=${APP_EDGEQUAKE_TENANT_ID}
      # Dashboard admin
      - APP_DASHBOARD_ADMIN_USER=${APP_DASHBOARD_ADMIN_USER:-admin}
      - APP_DASHBOARD_ADMIN_PASS=${APP_DASHBOARD_ADMIN_PASS}
      # Stripe
      - APP_STRIPE_SECRET_KEY=${APP_STRIPE_SECRET_KEY}
      - APP_STRIPE_PUBLISHABLE_KEY=${APP_STRIPE_PUBLISHABLE_KEY}
      - APP_STRIPE_WEBHOOK_SECRET=${APP_STRIPE_WEBHOOK_SECRET}
      - APP_STRIPE_PRICE_ID=${APP_STRIPE_PRICE_ID}
      # Cluster mode — migrations are handled by the migrate init container
      - APP_SKIP_MIGRATIONS=true
      # Tuning for cluster mode — lower per-pod DB connections since 10 pods share the pool
      - APP_DB_MAX_IDLE_CONNS=10
      - APP_DB_MAX_OPEN_CONNS=20
      # A2A: Allow connecting to private/Docker-internal agent addresses
      - A2A_ALLOW_PRIVATE_NETWORKS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tls:/app/tls:ro
    networks:
      - intranet
    depends_on:
      migrate:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--no-check-certificate",
          "-q",
          "https://127.0.0.1:8090/liveness",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # Redis — master + 2 replicas for read distribution + data redundancy
  # ===========================================================================
  redis-master:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redis-master-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    command:
      - redis-server
      - --replicaof
      - redis-master
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - intranet
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    command:
      - redis-server
      - --replicaof
      - redis-master
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - intranet
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Sentinel — 3 sentinels for automatic failover
  redis-sentinel-1:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./infra/cluster/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
    networks:
      - intranet
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./infra/cluster/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
    networks:
      - intranet
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./infra/cluster/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
    networks:
      - intranet
    depends_on:
      redis-master:
        condition: service_healthy

  # ===========================================================================
  # PostgreSQL — shared by all 10 pods (200 max_connections for 10×20 pool)
  # ===========================================================================
  app-postgres:
    image: postgres:16-alpine
    container_name: app-postgres-cluster
    command:
      - postgres
      - -c
      - max_connections=250
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - effective_cache_size=512MB
      - -c
      - statement_timeout=10000
      - -c
      - idle_in_transaction_session_timeout=30000
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=projections
    ports:
      - "5435:5432"
    volumes:
      - app-postgres-cluster-data:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d projections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO — shared object storage
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: minio-cluster
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-cluster-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket-cluster
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - intranet
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb --ignore-existing local/artifacts;
      echo 'Bucket created';
      exit 0;
      "

  # ===========================================================================
  # EdgeQuake — shared knowledge graph (same as single-node setup)
  # ===========================================================================
  edgequake-db:
    build:
      context: ./infra/edgequake
      dockerfile: Dockerfile.postgres
    container_name: edgequake-db-cluster
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=edgequake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgequake_secret}
      - POSTGRES_DB=edgequake
    volumes:
      - edgequake-db-cluster-data:/var/lib/postgresql/data
      - ./infra/edgequake/init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  edgequake-api:
    image: ghcr.io/raphaelmansuy/edgequake:latest
    container_name: edgequake-api-cluster
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - EDGEQUAKE_HOST=0.0.0.0
      - EDGEQUAKE_PORT=8080
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@edgequake-db:5432/edgequake
      - OPENAI_API_KEY
      - RUST_LOG=info,edgequake=debug
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OLLAMA_MODEL=gemma3:12b
      - OLLAMA_EMBEDDING_MODEL=embeddinggemma:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      edgequake-db:
        condition: service_healthy
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Proxy for local Ollama
  ollama-socat:
    image: alpine/socat
    command: tcp-listen:11435,fork,bind=0.0.0.0 tcp:127.0.0.1:11434
    network_mode: host
    restart: always

networks:
  intranet:

volumes:
  redis-master-data:
  minio-cluster-data:
  app-postgres-cluster-data:
  edgequake-db-cluster-data:
