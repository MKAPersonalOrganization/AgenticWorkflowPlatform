services:
  # =============================================================================
  # Application — only started in production-parity mode (`task up:prod`)
  # In dev mode the app runs on the host via `task dev`.
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-with-ai:local
    profiles: [prod]
    ports:
      - "8090:8090"
    environment:
      # Bind to all interfaces inside the container
      - SCHOOL_WEB_API_HOST=0.0.0.0:8090
      - SCHOOL_WEB_DEBUG_HOST=127.0.0.1:4015
      # TLS — certs are mounted from host
      - SCHOOL_WEB_TLS_CERT=/app/tls/cert.pem
      - SCHOOL_WEB_TLS_KEY=/app/tls/key.pem
      # Redis — internal Docker hostname + auth
      - SCHOOL_REDIS_ADDR=redis:6379
      - SCHOOL_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Database — internal Docker hostname
      - SCHOOL_DB_HOST=app-postgres:5432
      - SCHOOL_DB_USER=schoolai
      - SCHOOL_DB_PASSWORD=${SCHOOL_DB_PASSWORD}
      - SCHOOL_DB_NAME=projections
      - SCHOOL_DB_DISABLE_TLS=true
      # Auth — Google OAuth
      - SCHOOL_AUTH_APP_URL=https://localhost:8090
      - SCHOOL_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SCHOOL_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SCHOOL_AUTH_SESSION_SECRET=${SESSION_SECRET}
      # MinIO — internal Docker hostname
      - SCHOOL_ARTIFACTS_S_3_ENDPOINT=minio:9000
      - SCHOOL_ARTIFACTS_S_3_ACCESS_KEY=${SCHOOL_ARTIFACTS_S_3_ACCESS_KEY}
      - SCHOOL_ARTIFACTS_S_3_SECRET_KEY=${SCHOOL_ARTIFACTS_S_3_SECRET_KEY}
      - SCHOOL_ARTIFACTS_S_3_BUCKET=artifacts
      - SCHOOL_ARTIFACTS_S_3_USE_SSL=false
      # AI settings are now per-user (stored in database)
      # Edgequake
      - SCHOOL_EDGEQUAKE_BASE_URL=http://edgequake-api:8080
      - SCHOOL_EDGEQUAKE_TENANT_ID=${SCHOOL_EDGEQUAKE_TENANT_ID}
      # Dashboard admin
      - SCHOOL_DASHBOARD_ADMIN_USER=${SCHOOL_DASHBOARD_ADMIN_USER:-admin}
      - SCHOOL_DASHBOARD_ADMIN_PASS=${SCHOOL_DASHBOARD_ADMIN_PASS}
    volumes:
      - ./tls:/app/tls:ro # mount self-signed cert
    networks:
      - intranet
    depends_on:
      redis:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Redis for Asynq task queue — no host port in base (only in override for dev)
  redis:
    image: redis:7-alpine
    # No host port binding — only reachable inside intranet network
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL for Application Projections (AGUI, LLM Context)
  app-postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      - POSTGRES_USER=schoolai
      - POSTGRES_PASSWORD=${SCHOOL_DB_PASSWORD}
      - POSTGRES_DB=projections
    ports:
      - "5435:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for Artifact Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Bucket Initialization — private bucket (no anonymous access)
  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - intranet
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb --ignore-existing local/artifacts;
      echo 'Bucket created (private — files served via pre-signed URLs)';
      exit 0;
      "

  # EdgeQuake dedicated database with Apache AGE and pgvector
  edgequake-db:
    build:
      context: ./edgequake/edgequake/docker
      dockerfile: Dockerfile.postgres
    container_name: edgequake-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=edgequake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgequake_secret}
      - POSTGRES_DB=edgequake
    volumes:
      - edgequake-db-data:/var/lib/postgresql/data
      - ./edgequake/edgequake/docker/init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # EdgeQuake API Server
  edgequake-api:
    build:
      context: ./edgequake/edgequake
      dockerfile: docker/Dockerfile
    container_name: edgequake-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - EDGEQUAKE_HOST=0.0.0.0
      - EDGEQUAKE_PORT=8080
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@edgequake-db:5432/edgequake
      - OPENAI_API_KEY
      - RUST_LOG=info,edgequake=debug
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OLLAMA_MODEL=gemma3:12b
      - OLLAMA_EMBEDDING_MODEL=embeddinggemma:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      edgequake-db:
        condition: service_healthy
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Proxy for local Ollama (since it binds to 127.0.0.1)
  ollama-socat:
    image: alpine/socat
    command: tcp-listen:11435,fork,bind=0.0.0.0 tcp:127.0.0.1:11434
    network_mode: host
    restart: always

networks:
  intranet:

volumes:
  go-modules:
  redis-data:
  minio-data:
  app-postgres-data:
  edgequake-db-data:
