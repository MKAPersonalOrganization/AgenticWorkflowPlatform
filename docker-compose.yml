services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8090:8090"
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
    working_dir: /workspace
    command: go run main.go
    environment:
      - CGO_ENABLED=1
      - GO111MODULE=on
      - SERVER_ADDR=0.0.0.0:8090
      - APP_URL=http://127.0.0.1:8090
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_ADMIN_URL=http://kratos:4434
      - KRATOS_BROWSER_URL=http://127.0.0.1:4433
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - intranet

  # For testing only
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
    working_dir: /workspace
    command: go test ./... -v
    environment:
      - CGO_ENABLED=1
      - GO111MODULE=on
    networks:
      - intranet

  # PostgreSQL database for Kratos
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    ports:
      - "5433:5432"
    volumes:
      - kratos-postgres:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailSlurper for email testing
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436" # Web UI
      - "4437:4437" # API
    networks:
      - intranet
  # Kratos database migration
  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - intranet
    depends_on:
      postgres:
        condition: service_healthy

  # Kratos identity and session management
  kratos:
    image: oryd/kratos:v1.3.0
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=info
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos
    networks:
      - intranet
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
networks:
  intranet:

volumes:
  go-modules:
  kratos-postgres:
