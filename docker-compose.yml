services:
  # Redis for Asynq task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Asynqmon - monitoring UI for Asynq
  asynqmon:
    image: hibiken/asynqmon:latest
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - intranet
    depends_on:
      redis:
        condition: service_healthy

  # RedisInsight - Redis GUI for monitoring pub/sub, keys, and streams
  # Access at http://localhost:5540
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - intranet
    depends_on:
      redis:
        condition: service_healthy

  # PostgreSQL database for Kratos
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    ports:
      - "5433:5432"
    volumes:
      - kratos-postgres:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailSlurper for email testing
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436" # Web UI
      - "4437:4437" # API
    networks:
      - intranet
  # Kratos database migration
  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - intranet
    depends_on:
      postgres:
        condition: service_healthy

  # Kratos identity and session management
  kratos:
    image: oryd/kratos:v1.3.0
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=info
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos
    networks:
      - intranet
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  # PostgreSQL for Application Projections (AGUI, LLM Context)
  app-postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      - POSTGRES_USER=schoolai
      - POSTGRES_PASSWORD=dev-password
      - POSTGRES_DB=projections
    ports:
      - "5435:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolai"]
      interval: 10s
      timeout: 5s
      retries: 5




  # MinIO for Artifact Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --address ":9000" --console-address ":9001" /data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniosecret
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO Bucket Initialization for Artifacts
  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - intranet
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio miniosecret; do echo 'Waiting for MinIO...'; sleep 1; done;
      mc mb --ignore-existing local/artifacts;
      mc anonymous set public local/artifacts;
      echo 'Bucket created';
      exit 0;
      "

  # EdgeQuake dedicated database with Apache AGE and pgvector
  edgequake-db:
    build:
      context: ./edgequake/edgequake/docker
      dockerfile: Dockerfile.postgres
    container_name: edgequake-db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=edgequake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgequake_secret}
      - POSTGRES_DB=edgequake
    volumes:
      - edgequake-db-data:/var/lib/postgresql/data
      - ./edgequake/edgequake/docker/init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # EdgeQuake API Server
  edgequake-api:
    build:
      context: ./edgequake/edgequake
      dockerfile: docker/Dockerfile
    container_name: edgequake-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - EDGEQUAKE_HOST=0.0.0.0
      - EDGEQUAKE_PORT=8080
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@edgequake-db:5432/edgequake
      - OPENAI_API_KEY
      - RUST_LOG=info,edgequake=debug
      - OLLAMA_HOST=http://host.docker.internal:11435
      - OLLAMA_MODEL=gemma3:12b
      - OLLAMA_EMBEDDING_MODEL=embeddinggemma:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      edgequake-db:
        condition: service_healthy
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Proxy for local Ollama (since it binds to 127.0.0.1)
  ollama-socat:
    image: alpine/socat
    command: tcp-listen:11435,fork,bind=0.0.0.0 tcp:127.0.0.1:11434
    network_mode: host
    restart: always

  # EdgeQuake Web UI
  edgequake-web:
    build:
      context: ./edgequake
      dockerfile: edgequake_webui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    container_name: edgequake-web
    restart: unless-stopped
    ports:
      - "3002:3000"
    networks:
      - intranet

networks:
  intranet:

volumes:
  go-modules:
  kratos-postgres:
  redis-data:
  redis-insight-data:


  minio-data:
  app-postgres-data:
  edgequake-db-data:
