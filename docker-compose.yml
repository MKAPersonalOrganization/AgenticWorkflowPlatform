services:
  # Redis for Asynq task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Asynqmon - monitoring UI for Asynq
  asynqmon:
    image: hibiken/asynqmon:latest
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - intranet
    depends_on:
      redis:
        condition: service_healthy

  # PostgreSQL database for Kratos
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=kratos
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=kratos
    ports:
      - "5433:5432"
    volumes:
      - kratos-postgres:/var/lib/postgresql/data
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MailSlurper for email testing
  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436" # Web UI
      - "4437:4437" # API
    networks:
      - intranet
  # Kratos database migration
  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure
    networks:
      - intranet
    depends_on:
      postgres:
        condition: service_healthy

  # Kratos identity and session management
  kratos:
    image: oryd/kratos:v1.3.0
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    environment:
      - DSN=postgres://kratos:secret@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      - LOG_LEVEL=info
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos
    networks:
      - intranet
    restart: unless-stopped
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  # KurrentDB - Event Store (PostgreSQL-backed)
  kurrentdb:
    image: docker.kurrent.io/eventstore/eventstoredb-ee:lts
    container_name: kurrentdb
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_INSECURE=true # For development only
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
      - EVENTSTORE_MEM_DB=false
      - EVENTSTORE_DB=/var/lib/eventstore
      - EVENTSTORE_LOG_LEVEL=Information
    ports:
      - "2113:2113" # HTTP API and UI
      - "1113:1113" # TCP (for client connections)
    volumes:
      - kurrentdb-data:/var/lib/eventstore
      - kurrentdb-logs:/var/log/eventstore
    networks:
      - intranet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2113/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  intranet:

volumes:
  go-modules:
  kratos-postgres:
  redis-data:
  kurrentdb-data:
  kurrentdb-logs:
