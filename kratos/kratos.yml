version: v0.13.0

dsn: env://DATABASE_URL

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - https://localhost:8090
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: https://localhost:8090/
  allowed_return_urls:
    - https://localhost:8090

  methods:
    password:
      enabled: true
    totp:
      config:
        issuer: Compass
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
      config:
        lifespan: 15m
      passwordless_enabled: false
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            # Overridden at runtime via environment variables:
            # SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID
            # SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET
            client_id: ""
            client_secret: ""
            scope:
              - openid
              - email
              - profile
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
          # Apple Sign-In requires HTTPS on a registered domain.
          # Uncomment for staging/production deployments.
          # - id: apple
          #   provider: apple
          #   client_id: env://OIDC_APPLE_CLIENT_ID
          #   apple_team_id: env://OIDC_APPLE_TEAM_ID
          #   apple_private_key_id: env://OIDC_APPLE_PRIVATE_KEY_ID
          #   apple_private_key: env://OIDC_APPLE_PRIVATE_KEY
          #   scope:
          #     - openid
          #     - email
          #     - name
          #   mapper_url: file:///etc/config/kratos/oidc.apple.jsonnet

  flows:
    error:
      ui_url: https://localhost:8090/auth/error

    settings:
      ui_url: https://localhost:8090/auth/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: https://localhost:8090/auth/recovery
      use: code
      after:
        default_browser_return_url: https://localhost:8090/auth/login

    verification:
      enabled: true
      ui_url: https://localhost:8090/auth/verification
      use: code
      after:
        default_browser_return_url: https://localhost:8090/

    logout:
      after:
        default_browser_return_url: https://localhost:8090/auth/login

    login:
      ui_url: https://localhost:8090/auth/login
      lifespan: 10m
      after:
        default_browser_return_url: https://localhost:8090/

    registration:
      lifespan: 10m
      ui_url: https://localhost:8090/auth/registration
      enable_legacy_one_step: true
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session

log:
  level: info
  format: json
  leak_sensitive_values: false

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
    from_address: noreply@schoolwithai.local

feature_flags:
  use_continue_with_transitions: false
